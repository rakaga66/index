    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; background: linear-gradient(145deg, #22063d, #5b177a); color: #fff; }
        main { width: min(900px, 100%); text-align: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 24px; padding: 24px; box-shadow: 0 24px 70px rgba(0,0,0,.35); }
        img { display: block; width: 100%; max-height: 480px; object-fit: cover; border-radius: 18px; }
        h1 { margin: 24px 0 10px; color: #ffd45a; font-size: clamp(2rem, 6vw, 4rem); }
        p { font-size: 1.15rem; line-height: 1.9; margin: 0 auto 22px; max-width: 680px; }
        a { display: inline-block; padding: 15px 40px; border-radius: 12px; background: #ffd45a; color: #24102f; text-decoration: none; font-weight: 900; font-size: 1.2rem; box-shadow: 0 6px 0 #b06c00; }
    </style>

<body>
    <main>
        <img id="thirtySecondsCover" src="/assets/portal/thirty-seconds-game.webp" alt="غلاف لعبة تحدي الـ30 ثانية" width="2211" height="1536" loading="eager">
        <h1>تحدي الـ30 ثانية</h1>
        <p>لعبة جماعية سريعة بين فريقين. اختبر سرعة الإجابة ونافس قبل انتهاء الثلاثين ثانية.</p>
        <a href="https://30sec-vert.vercel.app/" target="_blank" rel="noopener">العب الآن</a>
    </main>
    <script>
        const cover = document.getElementById('thirtySecondsCover');
        const useLocalCover = () => {
            if (cover.dataset.localFallback === 'true') return;
            if (location.protocol !== 'file:' && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
            cover.dataset.localFallback = 'true';
            cover.src = '../public/assets/portal/thirty-seconds-game.webp';
        };
        cover.addEventListener('error', useLocalCover, { once: true });
        if (location.protocol === 'file:') useLocalCover();
    </script>
</body>
